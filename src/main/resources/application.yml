spring:
  application:
    name: coffeeshop-mdp
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/coffeeshop}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.types.print.banner: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:password}
  
  security:
    filter:
      order: 5

coffeeshop:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-key-change-in-production-at-least-32-characters-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours
  
  pubsub:
    enabled: false
  
  metadata:
    cache-ttl-minutes: ${METADATA_CACHE_TTL:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.coffeeshop: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

