spring:
  application:
    name: coffeeshop-mdp
  
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.security.autoconfigure.actuate.web.servlet.ManagementWebSecurityAutoConfiguration

  security:
    filter:
      order: 5
    user:
      name: disabled
      password: disabled

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/coffeeshop}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.types.print.banner: false
      hibernate.type.json_format_mapper: jackson3

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  neo4j:
    uri: ${NEO4J_URI:neo4j+s://a7590ddd.databases.neo4j.io}
    authentication:
      username: ${NEO4J_USER:a7590ddd}
      password: ${NEO4J_PASSWORD:ObTDT4noae8Jyi-6rnZN7mo8utB4hT3xywFChhKS5Js}

coffeeshop:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-key-change-in-production-at-least-32-characters-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours
  
  pubsub:
    enabled: false
  
  metadata:
    cache-ttl-minutes: ${METADATA_CACHE_TTL:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.coffeeshop: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security.web.FilterChainProxy: TRACE

